# DEVELOPMENT-ONLY DEFAULTS.
#
# This file is the lowest-precedence configuration source, so every value here is only ever a value of last resort.
# All of them assume a local Postgres and a single developer on one machine.
#
# handler.tokens MUST be overridden for any run that is not local. It is the only credential the Briefing API has,
# and the value below is public knowledge to anyone who can read this repository -- a deployment that keeps it hands
# every Organization's Brief to whoever asks for it. Override it, and the db.* settings, in either
#
#   ~/.config/the-agency-hq/agency/config.properties
#
# or the environment. Both take precedence over this file.
db.password=dev
db.url=jdbc:postgresql://127.0.0.1:5432/the_agency
db.username=dev
handler.tokens=dev-token
poller.enabled=true
poller.intervalSeconds=60
