# DEVELOPMENT-ONLY DEFAULTS.
#
# This file is the lowest-precedence configuration source, so every value here is only ever a value of last resort.
# All of them assume a local Postgres and the local FusionAuth in src/main/fusionauth, both on this machine.
#
# The fusionauth.* settings MUST be overridden for any run that is not local. fusionauth.issuer points at a
# container on this machine that anyone can start with the checked-in Kickstart, so a deployment that keeps it
# would trust access tokens minted by an identity provider it does not control. Override those, and the db.*
# settings, in either
#
#   ~/.config/the-agency-hq/the-agency/config.properties
#
# or the environment. Both take precedence over this file.
#
# There are two FusionAuth Applications and so two client credentials, named as `latte-java/app` names its pair:
# the unprefixed keys are the browser-facing Agency itself, and the prefixed ones are the API client.
#
# fusionauth.clientId / fusionauth.clientSecret -- the `The Agency` Application, behind which the admin UI sits. A
# confidential client in the ordinary sense: the browser never sees the secret, only the server does.
#
# fusionauth.handlerClientId / fusionauth.handlerClientSecret -- the `The Agency Handler` Application. The id is the
# one the Handler ships compiled in (dev.theagencyhq.handler.auth.AuthConfiguration#CLIENT_ID) and is the value
# every Briefing API access token's `aud` claim must contain; changing it on one side alone rejects every token.
# The Handler itself never sees the secret -- it is a public client and uses PKCE -- but the Agency authenticates
# to FusionAuth with it: HTTP Basic on the token endpoint when refreshing and on the introspection endpoint.
#
# Keeping the two Applications separate is what stops a Handler's token from opening the admin UI, and an admin
# session cookie from calling the Briefing API: each profile requires its own client id in the token's `aud`.
#
# Both secrets are real credentials and belong in the override file or the environment for anything that is not a
# local run.
#
# fusionauth.baseURL is where FusionAuth is reachable. It is separate from fusionauth.issuer, which is the identity
# in the `iss` claim; they are the same string locally and need not be in production.
db.password=dev
db.url=jdbc:postgresql://127.0.0.1:5432/the_agency
db.username=dev
fusionauth.baseURL=http://localhost:9016
fusionauth.clientId=7e1c9a54-0f8b-4a2e-9c6d-3b5f81d0a742
fusionauth.clientSecret=super-secret-secret-that-should-be-regenerated-for-production
fusionauth.handlerClientId=fa83bc7c-f1c5-48af-8ecb-6c09cf766d73
fusionauth.handlerClientSecret=super-secret-secret-that-should-be-regenerated-for-production
fusionauth.issuer=http://localhost:9016
poller.enabled=true
poller.intervalSeconds=60
