# Points the tests at the test database and a fixed token
db.url=jdbc:postgresql://127.0.0.1:5432/the_agency_test
handler.tokens=test-token
poller.intervalSeconds=3600
# The tests drive the poller explicitly via testRun() so a cycle can never run concurrently with an assertion.
# PollerServiceTest starts a poller thread of its own to cover the nudge, and joins it before the method returns.
poller.enabled=false
